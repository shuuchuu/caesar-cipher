[project]
authors = [
  {name = "m09", email = "142691+m09@users.noreply.github.com"},
]
dependencies = []
description = "Implementation and testing of a Caesar cipher."
homepage = "https://github.com/shuuchuu/caesar-cipher"
license = "Apache-2.0"
license-files = ["LICENSE"]
name = "caesar-cipher"
readme = "README.md"
requires-python = ">= 3.13"
version = "0.1.0"

[dependency-groups]
dev = [
  "hypothesis >= 6",
  "mutmut >= 3.5",
  "pyrefly >= 1.4",
  "pytest >= 9",
  "pytest-cov >= 7",
  "ruff >= 0.17",
]

[tool.pytest]
# Not mutmut's copy of the tests, in mutants/.
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
ignore = [
  "D1",
  "incorrect-blank-line-before-class",
  "multi-line-summary-second-line",
  "non-empty-init-module",
]
preview = true
select = ["A", "B", "C", "D", "DOC", "E", "EM", "F", "I", "N", "PIE", "PTH", "RET", "RUF", "SIM", "SLF", "TC", "UP", "W"]

[tool.ruff.lint.pydocstyle]
convention = "google"

# Without a config, pyrefly falls back to its lenient "basic" preset. With one,
# it stops treating the project root as an import root, so tests couldn't
# import tests.conftest without search-path.
[tool.pyrefly]
search-path = ["."]

[build-system]
build-backend = "uv_build"
requires = ["uv_build>=0.13.6,<0.14.0"]
